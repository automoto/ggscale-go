name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  version:
    name: Tag matches version
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Compare tag with version.go
        run: |
          want="${GITHUB_REF_NAME#v}"
          grep -qF "const Version = \"$want\"" version.go ||
            { echo "::error::version.go Version is not $want"; exit 1; }

  lint-test:
    name: Lint and unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify go.mod
        run: go mod verify

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.1

      - name: go vet
        run: go vet ./...

      - name: go vet (browser build)
        run: make vet-js

      - name: OpenAPI operation coverage
        run: make openapi-check

      - name: go test -race
        run: go test -race ./...

  integration:
    name: Integration tests
    needs: lint-test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Integration tests (docker compose)
        run: make test-integration
