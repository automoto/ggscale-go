# Minimal stack for SDK integration tests: postgres + ggscale-server + two
# TURN relay nodes in one region.
# The server image applies its embedded migrations at startup, so no
# separate migrate container is needed; scripts/integration-test.sh
# seeds the tenant/project/API keys directly via psql once the server
# reports healthy (healthy ⇒ migrations done).
name: ggscale-go-it

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ggscale
      POSTGRES_PASSWORD: ggscale
      POSTGRES_DB: ggscale
    volumes:
      - ./seed.sql:/seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ggscale -d ggscale"]
      interval: 2s
      timeout: 3s
      retries: 30

  ggscale:
    # Pinned to an immutable release tag so contract tests can't silently
    # drift against a moving `latest`. Override with GGSCALE_IMAGE.
    image: ${GGSCALE_IMAGE:-ghcr.io/automoto/gg-scale:v0.9.75}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://ggscale:ggscale@postgres:5432/ggscale?sslmode=disable
      CACHE_BACKEND: memory
      HTTP_ADDR: ":8080"
      LOG_LEVEL: info
      # ENV=dev skips the production cross-validation (CORS, secure
      # cookies, digest pinning) that would refuse to boot this stack.
      ENV: dev
      # No mail flow is exercised by the tests; noop avoids a mailhog
      # container. The control panel is likewise not under test.
      MAIL_PROVIDER: noop
      CONTROL_PANEL_DISABLED: "true"
      # The server issues relay credentials for the nodes in its relay
      # registry. scripts/integration-test.sh registers the relay services
      # below through the admin API, and the registry probe marks them eligible.
      FEATURE_P2P_RELAY_ENABLED: "true"
      # Must be >= 32 bytes and equal to the relay's RELAY_SHARED_SECRET.
      RELAY_SHARED_SECRET: integration-relay-shared-secret-0123456789
      RELAY_STUN_URLS: stun:127.0.0.1:13478
      RELAY_PROBE_TOKEN: integration-relay-lifecycle-token-0123456789
      PLATFORM_ADMIN_TOKEN: integration-platform-admin-token-0123456789
    ports:
      # 18080 so the stack can run alongside a dev server on 8080.
      - "127.0.0.1:18080:8080"

  relay:
    image: ${GGSCALE_IMAGE:-ghcr.io/automoto/gg-scale:v0.9.75}
    command: ["relay"]
    environment:
      # The test clients reach the relay on 127.0.0.1:13478 and only use
      # relayed candidates, so the relayed addresses can be loopback inside
      # the container. That needs private peers allowed.
      RELAY_PUBLIC_IP: 127.0.0.1
      RELAY_ALLOW_PRIVATE_PEERS: "true"
      RELAY_SHARED_SECRET: integration-relay-shared-secret-0123456789
      RELAY_HEALTH_ADDR: 0.0.0.0:9091
      LIFECYCLE_TOKEN: integration-relay-lifecycle-token-0123456789
      LOG_LEVEL: info
    ports:
      - "127.0.0.1:13478:3478/udp"

  # Second relay in the same region, for the failover test: it drains this
  # one through its health port. Peers must share a relay: each relay's
  # relayed addresses are loopback inside its own container.
  relay2:
    image: ${GGSCALE_IMAGE:-ghcr.io/automoto/gg-scale:v0.9.75}
    command: ["relay"]
    environment:
      RELAY_PUBLIC_IP: 127.0.0.1
      RELAY_ALLOW_PRIVATE_PEERS: "true"
      RELAY_SHARED_SECRET: integration-relay-shared-secret-0123456789
      RELAY_HEALTH_ADDR: 0.0.0.0:9091
      LIFECYCLE_TOKEN: integration-relay-lifecycle-token-0123456789
      LOG_LEVEL: info
    ports:
      - "127.0.0.1:13480:3478/udp"
      - "127.0.0.1:19091:9091"
